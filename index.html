<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demà · Incassi e spese</title>
<style>
:root{
  --bg:#0b0f16; --panel:#121826; --panel2:#182033; --line:#243049;
  --tx:#e6ebf5; --mut:#8b97b0; --acc:#6d8fd8; --acc-tx:#0b0f16;
  --pos:#4cae8a; --neg:#d9695f; --warn:#d9a441;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#eef1f7; --line:#d9dfeb;
    --tx:#1b2333; --mut:#5d6a83; --acc:#3b62b8; --acc-tx:#ffffff;
    --pos:#23805e; --neg:#b8453b; --warn:#9a6d12;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1200px;margin:0 auto;padding:14px 14px 100px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
h2{font-size:16px;margin:0 0 10px;font-weight:650}
h3{font-size:14px;margin:0 0 8px;font-weight:650;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;color:var(--mut);border:0;padding:7px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--acc);color:var(--acc-tx);font-weight:600}
nav.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;border-bottom:1px solid var(--line)}
nav.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 12px;cursor:pointer;font:inherit;white-space:nowrap}
nav.tabs button.on{color:var(--tx);border-bottom-color:var(--acc);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi .v{font-size:21px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--mut)}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
input,select,button,textarea{font:inherit}
input[type=text],input[type=date],input[type=search],input[type=password],select{width:100%;background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{background:var(--acc);color:var(--acc-tx);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn.sec{background:var(--panel2);color:var(--tx);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg);font-weight:500}
.btn.sm{padding:4px 9px;min-height:30px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.tot{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-weight:600;color:var(--mut);font-size:12.5px;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tbl tfoot td{font-weight:650;border-top:2px solid var(--line);border-bottom:0}
.tbl tr.edit td{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.note{color:var(--mut);font-size:13px}
.warn{border-color:var(--warn);color:var(--warn)}
.empty{padding:18px;text-align:center;color:var(--mut)}
svg text{fill:var(--mut);font-size:11px}
svg .b1{fill:var(--acc)} svg .b2{fill:var(--neg);opacity:.75}
#quick{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:8}
#quick .btn{flex:1;max-width:260px;min-height:46px;font-size:16px}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;margin:10px 0 6px;cursor:pointer;font:inherit;text-align:left}
.mhead .ms{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (max-width:760px){
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 10px;background:var(--panel)}
  .tbl.cards td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:10px;text-align:right}
  .tbl.cards td::before{content:attr(data-label);color:var(--mut);text-align:left}
  .tbl.cards td.nolabel::before{content:none}
  .tbl.cards td:empty{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Demà · Incassi e spese</h1>
    <span id="syncState" class="note" aria-live="polite"></span>
    <div class="seg" id="annoSeg" role="group" aria-label="Anno"></div>
  </header>
  <div id="backupWarn"></div>
  <div id="closeWarn"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="quick"><button class="btn" data-quick="inc">+ Incasso</button><button class="btn sec" data-quick="sp">+ Spesa</button></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ---------- utilità ---------- */
const KEY='dema-tracker-v1', KEY_EXP='dema-tracker-last-export';
const MESI=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
function numParse(v){
  let s=String(v==null?'':v).trim().replace(/\s|€/g,'');
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmtE=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);
const fmtI=n=>new Intl.NumberFormat('it-IT',{maximumFractionDigits:0}).format(n||0);
const pct=n=>isFinite(n)?(n*100).toFixed(1).replace('.',',')+'%':'—';
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmtD=iso=>{const p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso};
const dow=iso=>new Date(iso+'T12:00:00').getDay();
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- dati ---------- */
const RIC0=[];
const DEF_SETUP={prezzoMedio:5.5,
  categorie:['Materie Prime','Personale','Bollette','Oneri Bancari','Pubblicità','Affitto','Altro','Eventi'],
  eventi:['Dopo Sole','Evento speciale','Sagra/festa locale','Chiusura anticipata','Ferie','Chiusura straordinaria'],
  meteo:['Brutto'],ricorrenti:RIC0};
const emptyDB=()=>({app:'dema-tracker',versione:1,incassi:[],spese:[],annuali:[],tasse:[],tombs:[],setup:JSON.parse(JSON.stringify(DEF_SETUP))});
function norm(d){
  const b=emptyDB();
  ['incassi','spese','annuali','tasse'].forEach(k=>{b[k]=Array.isArray(d&&d[k])?d[k]:[]});
  b.tombs=Array.isArray(d&&d.tombs)?d.tombs:[];
  b.setup=Object.assign(b.setup,(d&&d.setup)||{});
  if(!Array.isArray(b.setup.ricorrenti))b.setup.ricorrenti=JSON.parse(JSON.stringify(RIC0));
  ['incassi','spese','annuali','tasse'].forEach(k=>b[k].forEach(r=>{if(!r.id)r.id=uid(k.slice(0,2))}));
  return b;
}
function loadDB(){try{const raw=localStorage.getItem(KEY);if(raw)return norm(JSON.parse(raw))}catch(e){}return emptyDB()}
let DB=loadDB();
try{if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
let SIG={},SETUP_SIG='';
const COLS=['incassi','spese','annuali','tasse'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Salvataggio locale non riuscito: esporta un backup')}}
function saveDB(){stamp();persist();scheduleSync()}

const tot=r=>(r.contanti||0)+(r.pos||0)+(r.satispay||0);
const compet=t=>String(t.competenza||String(t.data).slice(0,4));

/* ---------- stato UI ---------- */
const UI={tab:'riepilogo',anno:String(new Date().getFullYear()),edit:{},
  f:{inc:{da:'',a:'',ev:'',me:''},sp:{da:'',a:'',cat:'',ev:'',q:''}},lim:{inc:60,sp:60},mo:{inc:{},sp:{}},open:{inc:false,sp:false},close:{open:false,ym:'',data:'',vals:{}}};
const yearsPresent=()=>{const s=new Set();DB.incassi.concat(DB.spese,DB.annuali).forEach(r=>s.add(String(r.data).slice(0,4)));return Array.from(s).sort()};
const inYear=iso=>UI.anno==='tutto'||String(iso).startsWith(UI.anno);

/* ---------- calcoli ---------- */
function stats(y){
  const sel=iso=>y==='tutto'||String(iso).startsWith(y);
  const inc=DB.incassi.filter(r=>sel(r.data));
  const sp=DB.spese.filter(r=>sel(r.data));
  const an=DB.annuali.filter(r=>sel(r.data));
  const tx=DB.tasse.filter(t=>y==='tutto'||compet(t)===y);
  const incasso=sum(inc.map(tot)), aperti=inc.filter(r=>tot(r)>0);
  const correnti=sum(sp.map(r=>r.importo)), annuali=sum(an.map(r=>r.importo));
  const mp=sum(sp.filter(r=>r.categoria==='Materie Prime').map(r=>r.importo));
  const pers=sum(sp.filter(r=>r.categoria==='Personale').map(r=>r.importo));
  const spese=correnti+annuali, utile=incasso-spese, tasse=sum(tx.map(t=>t.importo||0));
  const dichiarato=sum(inc.map(r=>r.chiusura||0));
  const fissi=annuali+(correnti-mp), food=incasso?mp/incasso:NaN;
  const be=(1-food)>0?fissi/(1-food):NaN;
  return {inc,sp,an,tx,incasso,aperti:aperti.length,media:aperti.length?incasso/aperti.length:0,
    correnti,annuali,mp,pers,spese,utile,tasse,dichiarato,food,
    prime:incasso?(mp+pers)/incasso:NaN,ebitda:incasso?utile/incasso:NaN,dopoTasse:utile-tasse,
    fissi,be,beDay:aperti.length?be/aperti.length:NaN};
}
function monthRows(y){
  const years=y==='tutto'?yearsPresent():[y], out=[];
  years.forEach(yy=>{
    const rows=[];
    for(let m=1;m<=12;m++){
      const p=yy+'-'+String(m).padStart(2,'0');
      const inc=DB.incassi.filter(r=>r.data.startsWith(p)), sp=DB.spese.filter(r=>r.data.startsWith(p)), an=DB.annuali.filter(r=>r.data.startsWith(p));
      rows.push({p,label:MESI[m-1]+' '+yy,incasso:sum(inc.map(tot)),ap:inc.filter(r=>tot(r)>0).length,
        correnti:sum(sp.map(r=>r.importo)),annuali:sum(an.map(r=>r.importo)),
        mp:sum(sp.filter(r=>r.categoria==='Materie Prime').map(r=>r.importo)),has:inc.length+sp.length+an.length>0});
    }
    const idx=rows.map((r,i)=>r.has?i:-1).filter(i=>i>=0);
    if(idx.length) out.push(...rows.slice(idx[0],idx[idx.length-1]+1));
  });
  return out;
}

/* ---------- shell ---------- */
const TABS=[['riepilogo','Riepilogo'],['incassi','Incassi'],['spese','Spese'],['fisse','Annuali e tasse'],['setup','Setup']];
function renderShell(){
  const ys=yearsPresent(); if(!ys.includes(String(new Date().getFullYear()))) ys.push(String(new Date().getFullYear()));
  ys.sort();
  $('#annoSeg').innerHTML=ys.concat(['tutto']).map(y=>`<button data-anno="${y}" class="${UI.anno===y?'on':''}">${y==='tutto'?'Tutto':y}</button>`).join('');
  $('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${UI.tab===t[0]?'on':''}" role="tab">${t[1]}</button>`).join('');
  const last=parseInt(localStorage.getItem(KEY_EXP)||'0',10), n=DB.incassi.length+DB.spese.length;
  const old=!last||(Date.now()-last)>14*864e5;
  {const t=todayISO(),ym=t.slice(0,7),dd=+t.slice(8,10),ld=+lastDay(ym).slice(8,10);let h='';
    if(dd>=ld-4&&DB.spese.length&&!UI.close.open){const pm=prevYM(ym);
      const miss=DB.setup.ricorrenti.filter(x=>{const k=keyD(x.desc);return DB.spese.some(r=>keyD(r.desc)===k&&ymOf(r.data)===pm)&&!DB.spese.some(r=>keyD(r.desc)===k&&ymOf(r.data)===ym)});
      if(miss.length)h=`<div class="card" style="padding:10px 14px;border-color:var(--acc)">Fine mese: mancano ${miss.length} voci ricorrenti di ${labelYM(ym)}. <a href="#" data-act="close-go" style="color:var(--acc)">Chiudi il mese</a></div>`}
    $('#closeWarn').innerHTML=h}
  $('#backupWarn').innerHTML=(n>0&&old&&!AUTH)?`<div class="card warn" style="padding:10px 14px">I dati stanno solo in questo browser. ${last?'Ultimo backup: '+new Date(last).toLocaleDateString('it-IT')+'.':'Non hai ancora fatto un backup.'} <a href="#" data-go="setup" style="color:inherit">Vai a Setup</a></div>`:'';
}
function render(){
  renderShell();
  const v={riepilogo:vRiepilogo,incassi:vIncassi,spese:vSpese,fisse:vFisse,setup:vSetup}[UI.tab];
  $('#view').innerHTML=v();
  if(UI.tab==='incassi'){listInc();fillIncForm()}
  if(UI.tab==='spese'){listSp();fillSpForm()}
  if(UI.tab==='fisse'){listFisse();fillFisseForms()}
}

/* ---------- riepilogo ---------- */
function kpi(l,v,s,cls){return `<div class="kpi"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}
function chart(rows){
  if(!rows.length) return '';
  const W=720,H=210,pl=8,pb=22,pt=8,bw=(W-pl*2)/rows.length;
  const mx=Math.max(1,...rows.map(r=>Math.max(r.incasso,r.correnti+r.annuali)));
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Incassi e spese per mese">`;
  rows.forEach((r,i)=>{
    const x=pl+i*bw, h1=(H-pb-pt)*r.incasso/mx, h2=(H-pb-pt)*(r.correnti+r.annuali)/mx, w=Math.max(4,bw/2-3);
    s+=`<rect class="b1" x="${x+2}" y="${H-pb-h1}" width="${w}" height="${h1}" rx="2"><title>${esc(r.label)} · incasso ${fmtE(r.incasso)}</title></rect>`;
    s+=`<rect class="b2" x="${x+2+w+2}" y="${H-pb-h2}" width="${w}" height="${h2}" rx="2"><title>${esc(r.label)} · spese ${fmtE(r.correnti+r.annuali)}</title></rect>`;
    if(rows.length<=14||i%2===0) s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${r.label.slice(0,3)}</text>`;
  });
  return s+'</svg><div class="note"><span style="color:var(--acc)">■</span> incasso &nbsp; <span style="color:var(--neg)">■</span> spese (correnti + annuali)</div>';
}
function vRiepilogo(){
  const S=stats(UI.anno);
  if(!DB.incassi.length&&!DB.spese.length) return `<div class="card empty">Ancora nessun dato. Registra il primo incasso nella scheda <b>Incassi</b>, oppure carica il backup in <b>Setup</b>.</div>`;
  const mr=monthRows(UI.anno);
  const kp=`<div class="kpis">
    ${kpi('Incasso',fmtE(S.incasso),S.aperti+' giorni di apertura')}
    ${kpi('Spese totali',fmtE(S.spese),'correnti '+fmtI(S.correnti)+' € · annuali '+fmtI(S.annuali)+' €')}
    ${kpi('Utile',fmtE(S.utile),'EBITDA '+pct(S.ebitda),S.utile>=0?'pos':'neg')}
    ${kpi('Utile dopo tasse',fmtE(S.dopoTasse),'tasse e contributi '+fmtE(S.tasse),S.dopoTasse>=0?'pos':'neg')}
    ${kpi('Media al giorno',fmtE(S.media),'sui giorni aperti')}
    ${kpi('Food cost',pct(S.food),'materie prime / incasso')}
    ${kpi('Prime cost',pct(S.prime),'(materie prime + personale) / incasso')}
    ${kpi('Dichiarato in cassa',fmtE(S.dichiarato),'somma della colonna Chiusura')}
  </div>`;
  const monthTbl=`<div class="card"><h2>Mese per mese</h2>${chart(mr)}
    <div class="tblwrap"><table class="tbl cards"><thead><tr><th>Mese</th><th class="r">Incasso</th><th class="r">Spese correnti</th><th class="r">Annuali</th><th class="r">Utile</th><th class="r">Aperture</th><th class="r">Media/g</th><th class="r">Food</th></tr></thead><tbody>
    ${mr.map(r=>{const u=r.incasso-r.correnti-r.annuali;return `<tr><td data-label="Mese">${esc(r.label)}</td><td class="r" data-label="Incasso">${fmtE(r.incasso)}</td><td class="r" data-label="Spese correnti">${fmtE(r.correnti)}</td><td class="r" data-label="Annuali">${r.annuali?fmtE(r.annuali):''}</td><td class="r ${u>=0?'pos':'neg'}" data-label="Utile">${fmtE(u)}</td><td class="r" data-label="Aperture">${r.ap}</td><td class="r" data-label="Media/g">${r.ap?fmtE(r.incasso/r.ap):'—'}</td><td class="r" data-label="Food">${r.incasso?pct(r.mp/r.incasso):'—'}</td></tr>`}).join('')}
    </tbody></table></div><div class="note" style="margin-top:6px">Gli annuali compaiono nel mese in cui li hai pagati.</div></div>`;
  // giorni settimana
  const wd=[1,2,3,4,5,6,0].map((d,i)=>{const rs=S.inc.filter(r=>tot(r)>0&&dow(r.data)===d);return {n:GGL[i],k:rs.length,t:sum(rs.map(tot))}});
  const mxw=Math.max(1,...wd.map(w=>w.k?w.t/w.k:0));
  const wdCard=`<div class="card"><h2>Per giorno della settimana</h2>${wd.map(w=>`<div style="display:grid;grid-template-columns:90px 1fr 110px;gap:8px;align-items:center;margin:5px 0"><span>${w.n}</span><div class="bar"><i style="width:${w.k?100*(w.t/w.k)/mxw:0}%"></i></div><span class="r" style="text-align:right">${w.k?fmtE(w.t/w.k):'—'} <span class="mut">(${w.k})</span></span></div>`).join('')}<div class="note">Media sui giorni aperti, tra parentesi quanti giorni.</div></div>`;
  // metodo pagamento
  const mt=[['Contanti',sum(S.inc.map(r=>r.contanti||0))],['POS',sum(S.inc.map(r=>r.pos||0))],['Satispay',sum(S.inc.map(r=>r.satispay||0))]];
  const pay=`<div class="card"><h2>Metodo di pagamento</h2>${mt.map(m=>`<div style="display:grid;grid-template-columns:90px 1fr 130px;gap:8px;align-items:center;margin:5px 0"><span>${m[0]}</span><div class="bar"><i style="width:${S.incasso?100*m[1]/S.incasso:0}%"></i></div><span style="text-align:right">${fmtE(m[1])} <span class="mut">${pct(S.incasso?m[1]/S.incasso:NaN)}</span></span></div>`).join('')}</div>`;
  // categorie
  const cats=DB.setup.categorie.map(c=>({c,t:sum(S.sp.filter(r=>r.categoria===c).map(r=>r.importo))})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  const catC=`<div class="card"><h2>Spese correnti per categoria</h2>${cats.length?cats.map(x=>`<div style="display:grid;grid-template-columns:120px 1fr 130px;gap:8px;align-items:center;margin:5px 0"><span>${esc(x.c)}</span><div class="bar"><i style="width:${S.correnti?100*x.t/S.correnti:0}%"></i></div><span style="text-align:right">${fmtE(x.t)} <span class="mut">${pct(x.t/S.correnti)}</span></span></div>`).join(''):'<div class="empty">Nessuna spesa nel periodo</div>'}</div>`;
  // fornitori
  const fm={};S.sp.forEach(r=>{const k=(r.desc||'—').trim();fm[k]=(fm[k]||0)+r.importo});
  const top=Object.entries(fm).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const fC=`<div class="card"><h2>Fornitori e voci principali</h2>${top.map(t=>`<div style="display:flex;justify-content:space-between;margin:4px 0"><span>${esc(t[0])}</span><span>${fmtE(t[1])}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;
  // break-even
  const prezzo=DB.setup.prezzoMedio||0, pezzi=(S.beDay&&prezzo)?Math.ceil(S.beDay/prezzo):NaN;
  const beC=`<div class="card"><h2>Punto di pareggio</h2>
    <div class="grid g2" style="gap:6px 16px">
      <span class="mut">Costi fissi (annuali + spese non materie prime)</span><b style="text-align:right">${fmtE(S.fissi)}</b>
      <span class="mut">Food cost reale</span><b style="text-align:right">${pct(S.food)}</b>
      <span class="mut">Incasso di pareggio nel periodo</span><b style="text-align:right">${fmtE(S.be)}</b>
      <span class="mut">Incasso minimo al giorno (${S.aperti} giorni)</span><b style="text-align:right">${fmtE(S.beDay)}</b>
      <span class="mut">Pezzi al giorno (prezzo medio ${fmtE(prezzo)})</span><b style="text-align:right">${isFinite(pezzi)?pezzi:'—'}</b>
    </div><div class="note" style="margin-top:6px">Calcolo: costi fissi / (1 − food cost). Il prezzo medio si cambia in Setup.</div></div>`;
  // confronto anni
  let cmp='';
  const ys=yearsPresent().filter(y=>DB.incassi.some(r=>r.data.startsWith(y)));
  if(ys.length>=2){
    const a=stats(ys[ys.length-2]), b=stats(ys[ys.length-1]);
    const row=(l,x,y,f,isPct)=>`<tr><td>${l}</td><td class="r">${f(x)}</td><td class="r">${f(y)}</td><td class="r ${(y-x)>=0?'pos':'neg'}">${isPct?((y-x)*100).toFixed(1).replace('.',',')+' pt':(x?pct((y-x)/x):'—')}</td></tr>`;
    cmp=`<div class="card"><h2>${ys[ys.length-2]} contro ${ys[ys.length-1]}</h2><div class="note">Anno intero contro anno in corso: l'anno in corso è ancora incompleto.</div><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th class="r">${ys[ys.length-2]}</th><th class="r">${ys[ys.length-1]}</th><th class="r">Variazione</th></tr></thead><tbody>
      ${row('Incasso',a.incasso,b.incasso,fmtE)}${row('Spese',a.spese,b.spese,fmtE)}${row('Utile',a.utile,b.utile,fmtE)}${row('Giorni aperti',a.aperti,b.aperti,fmtI)}${row('Media al giorno',a.media,b.media,fmtE)}${row('Food cost',a.food,b.food,pct,true)}${row('EBITDA',a.ebitda,b.ebitda,pct,true)}
      </tbody></table></div></div>`;
  }
  return kp+monthTbl+`<div class="cols2">${wdCard}${pay}</div><div class="cols2">${catC}${fC}</div><div class="cols2">${beC}${cmp}</div>`;
}

function monthGroups(rows){const g=[];rows.forEach(r=>{const ym=r.data.slice(0,7);let x=g[g.length-1];if(!x||x.ym!==ym){x={ym,rows:[]};g.push(x)}x.rows.push(r)});return g}

const moBulk=k=>`<div class="row" style="margin:4px 0 2px"><button class="btn sec sm" data-act="mo-all" data-k="${k}" data-v="1">Apri tutti i mesi</button><button class="btn sec sm" data-act="mo-all" data-k="${k}" data-v="0">Chiudi tutti</button></div>`;
function listInc(){

  groups.map((g,i)=>{const gt=sum(g.rows.map(tot)),ga=g.rows.filter(r=>tot(r)>0).length;
    return monthHead('inc',g,i,`${fmtE(gt)} · ${ga} giorni · media ${fmtE(ga?gt/ga:0)}`)+(moOpen('inc',g.ym,i)?`<div class="tblwrap"><table class="tbl cards"><thead><tr><th>Data</th><th>Giorno</th><th class="r">Contanti</th><th class="r">POS</th><th class="r">Satispay</th><th class="r">Totale</th><th class="r">Chiusura</th><th>Meteo</th><th>Evento</th><th></th></tr></thead><tbody>${g.rows.map(rowHtml).join('')}</tbody></table></div>`:'')}).join('');
}

function errText(e){
  const m=String((e&&e.message)||e);
  if(e&&e.auth)return 'Sessione scaduta: esci e accedi di nuovo (Setup)';
  if(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Nessuna connessione';

  if(/API key/i.test(m))return 'Chiave API non valida';

async function jpost(url,body,headers){
  const r=await fetch(url,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},headers||{}),body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const m=(j&&j.error&&(j.error.message||j.error.status))||('HTTP '+r.status);const err=new Error(typeof m==='string'?m:JSON.stringify(m));err.status=r.status;throw err}
  return j;
}
async function signIn(email,pw){
  const j=await jpost('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+FB.apiKey,{email,password:pw,returnSecureToken:true});
  TOK={id:j.idToken,exp:Date.now()+(+j.expiresIn||3600)*1000};
  AUTH={email,refreshToken:j.refreshToken};
  try{localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH))}catch(e){}
}
async function getToken(){
  if(!AUTH)throw new Error('non collegato');
  if(TOK.id&&Date.now()<TOK.exp-60000)return TOK.id;
  const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.refreshToken)});
  const j=await r.json().catch(()=>null);
  if(!r.ok||!j||!j.id_token){const e=new Error('SESSIONE_SCADUTA');e.auth=true;throw e}
  TOK={id:j.id_token,exp:Date.now()+(+j.expires_in||3600)*1000};
  if(j.refresh_token&&j.refresh_token!==AUTH.refreshToken){AUTH.refreshToken=j.refresh_token;try{localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH))}catch(e){}}
  return TOK.id;
}
const fields=(rec,u,del,sv)=>({u:{integerValue:String(u||0)},s:{integerValue:String(sv||0)},deleted:{booleanValue:!!del},d:{stringValue:del?'':JSON.stringify(rec)}});
async function fsQuery(coll,since,tok){
  const j=await jpost(FS+':runQuery',{structuredQuery:{from:[{collectionId:coll}],where:{fieldFilter:{field:{fieldPath:'s'},op:'GREATER_THAN',value:{integerValue:String(since)}}},orderBy:[{field:{fieldPath:'s'},direction:'ASCENDING'}]}},{Authorization:'Bearer '+tok});
  return (j||[]).filter(x=>x.document).map(x=>{const f=x.document.fields||{};
    return {id:decodeURIComponent(x.document.name.split('/').pop()),u:+((f.u||{}).integerValue||0),s:+((f.s||{}).integerValue||0),del:!!(f.deleted||{}).booleanValue,rec:(f.d&&f.d.stringValue)?JSON.parse(f.d.stringValue):null}});
}
async function fsCommit(writes,tok){
  for(let i=0;i<writes.length;i+=400)await jpost(FS+':commit',{writes:writes.slice(i,i+400)},{Authorization:'Bearer '+tok});
}
function scheduleSync(){if(!AUTH)return;clearTimeout(syncTimer);syncTimer=setTimeout(doSync,2500)}
async function doSync(){
  if(!AUTH)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;clearTimeout(syncTimer);setSync('busy');
  const t0=Date.now();let ok=false;
  try{
    const tok=await getToken();
    const since=SY.pull<0?-1:Math.max(-1,SY.pull-600000);
    const accepted=new Set();let maxU=SY.pull,changed=false;
    for(const c of COLS){
      const docs=await fsQuery(c,since,tok);
      docs.forEach(d=>{
        if(d.s>maxU)maxU=d.s;
        const i=DB[c].findIndex(r=>r.id===d.id),loc=i>=0?DB[c][i]:null,tb=DB.tombs.find(t=>t.c===c&&t.id===d.id);
        const lu=loc?(loc._u||0):(tb?(tb._u||0):-1);
        if(d.u<=lu)return;
        DB.tombs=DB.tombs.filter(t=>!(t.c===c&&t.id===d.id));
        if(d.del){if(i>=0)DB[c].splice(i,1);DB.tombs.push({c,id:d.id,_u:d.u})}
        else if(d.rec){d.rec._u=d.u;if(i>=0)DB[c][i]=d.rec;else DB[c].push(d.rec)}
        accepted.add(c+'/'+d.id);changed=true;
      });
    }
    {const docs=await fsQuery('setup',since,tok);
      docs.forEach(d=>{if(d.s>maxU)maxU=d.s;if(d.id!=='main'||!d.rec||d.u<=(DB.setup._u||0))return;
        DB.setup=Object.assign(JSON.parse(JSON.stringify(DEF_SETUP)),d.rec,{_u:d.u});accepted.add('setup/main');changed=true})}
    // invio quello che è nuovo o modificato da questo dispositivo
    const first=SY.push===0,need=u=>first||(u||0)>SY.push,writes=[];
    COLS.forEach(c=>DB[c].forEach(r=>{if(!accepted.has(c+'/'+r.id)&&need(r._u))writes.push({update:{name:DOCROOT+'/'+c+'/'+r.id,fields:fields(r,r._u,false,t0)}})}));
    DB.tombs.forEach(t=>{if(!accepted.has(t.c+'/'+t.id)&&need(t._u))writes.push({update:{name:DOCROOT+'/'+t.c+'/'+t.id,fields:fields(null,t._u,true,t0)}})});
    if(!accepted.has('setup/main')&&need(DB.setup._u))writes.push({update:{name:DOCROOT+'/setup/main',fields:fields(DB.setup,DB.setup._u,false,t0)}});
    if(writes.length){await fsCommit(writes,tok);if(t0>maxU)maxU=t0}
    SY.pull=maxU;SY.push=t0;SY.at=Date.now();saveSY();
    if(changed){buildSIG();persist()}
    ok=true;setSync('ok');
    if(changed){const busy=UI.open.inc||UI.open.sp||UI.close.open||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));if(!busy)render()}
  }catch(e){
    if(e&&e.status===401)TOK={id:'',exp:0};
    setSync('err',errText(e));
  }
  syncBusy=false;
  if(syncAgain){syncAgain=false;if(ok)scheduleSync()}
}

function syncCard(){
  if(!AUTH)return `<div class="card"><h2>Sincronizzazione (Firebase)</h2><p class="note">Accedi con l'utente creato su Firebase per tenere allineati telefono e PC. I dati restano anche su questo dispositivo, quindi funziona anche senza rete.</p>
  <div class="row"><div><label for="sy_mail">Email</label><input type="text" id="sy_mail" inputmode="email" autocomplete="username" style="max-width:260px"></div><div><label for="sy_pw">Password</label><input type="password" id="sy_pw" autocomplete="current-password" style="max-width:200px"></div><button class="btn" data-act="sy-login">Accedi</button></div><div id="sy_msg" class="note" style="margin-top:8px"></div></div>`;
  return `<div class="card"><h2>Sincronizzazione (Firebase)</h2><p style="margin:0 0 4px">Collegato come <b>${esc(AUTH.email)}</b></p><p class="note" id="sy_msg" style="margin:0 0 10px">${esc(syncText())}</p><div class="row"><button class="btn" data-act="sy-now">Sincronizza ora</button><button class="btn sec" data-act="sy-logout">Esci</button></div></div>`;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AUTH)doSync()});
window.addEventListener('online',()=>{if(AUTH)doSync()});

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-anno],[data-tab],[data-go],[data-act],[data-quick]'); if(!t)return;
  if(t.dataset.quick){
    if(t.dataset.quick==='inc'){const ex=DB.incassi.find(r=>r.data===todayISO());UI.edit.inc=ex?ex.id:null;UI.open.inc=true;UI.tab='incassi';render();window.scrollTo(0,0);const c=$('#i_c');c.focus();c.select()}
    else{UI.edit.sp=null;UI.open.sp=true;UI.tab='spese';render();window.scrollTo(0,0);$('#s_desc').focus()}
    return;
  }
  if(t.dataset.anno){UI.anno=t.dataset.anno;UI.lim={inc:60,sp:60};render();return}
  if(t.dataset.tab){UI.tab=t.dataset.tab;UI.close={open:false,ym:'',data:'',vals:{}};UI.open={inc:false,sp:false};UI.edit.inc=null;UI.edit.sp=null;render();window.scrollTo(0,0);return}
  if(t.dataset.go){e.preventDefault();UI.tab=t.dataset.go;render();return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='edit-inc'){UI.edit.inc=id;UI.open.inc=true;render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='del-inc'){const r=DB.incassi.find(x=>x.id===id);if(r&&confirm('Elimino l\'incasso del '+fmtD(r.data)+'?')){DB.incassi=DB.incassi.filter(x=>x.id!==id);if(UI.edit.inc===id){UI.edit.inc=null;UI.open.inc=false}saveDB();render();toast('Eliminato')}}
  else if(a==='more-inc'){UI.lim.inc+=100;listInc()}
  else if(a==='reset-inc'){UI.f.inc={da:'',a:'',ev:'',me:''};render()}
  else if(a==='edit-sp'){UI.edit.sp=id;UI.open.sp=true;render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='del-sp'){const r=DB.spese.find(x=>x.id===id);if(r&&confirm('Elimino la spesa "'+r.desc+'" del '+fmtD(r.data)+'?')){DB.spese=DB.spese.filter(x=>x.id!==id);if(UI.edit.sp===id){UI.edit.sp=null;UI.open.sp=false}saveDB();render();toast('Eliminata')}}
  else if(a==='more-sp'){UI.lim.sp+=100;listSp()}
  else if(a==='reset-sp'){UI.f.sp={da:'',a:'',cat:'',ev:'',q:''};render()}
  else if(a==='edit-an'){UI.edit.an=id;fillFisseForms();listFisse();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='del-an'){const r=DB.annuali.find(x=>x.id===id);if(r&&confirm('Elimino "'+r.desc+'"?')){DB.annuali=DB.annuali.filter(x=>x.id!==id);saveDB();render();toast('Eliminato')}}
  else if(a==='edit-tx'){UI.edit.tx=id;fillFisseForms();listFisse();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='del-tx'){const r=DB.tasse.find(x=>x.id===id);if(r&&confirm('Elimino il versamento del '+fmtD(r.data)+'?')){DB.tasse=DB.tasse.filter(x=>x.id!==id);saveDB();render();toast('Eliminato')}}
  else if(a==='close-open'||a==='close-go'){e.preventDefault();openClose()}
  else if(a==='close-cancel'){UI.close={open:false,ym:'',data:'',vals:{}};render()}
  else if(a==='close-save'){closeSave()}
  else if(a==='fill-prev'){e.preventDefault();const s=ricStatus(UI.close.ym)[+t.dataset.i];if(s&&s.prev){UI.close.vals[s.k]=String(s.prev.v).replace('.',',');const inp=Array.from(document.querySelectorAll('.cm-in')).find(x=>x.dataset.k===s.k);if(inp)inp.value=UI.close.vals[s.k];$('#cm_tot').textContent=fmtE(closeTot())}}
  else if(a==='add-ric'){const v=$('#new_ric').value.trim();if(v&&!DB.setup.ricorrenti.some(x=>keyD(x.desc)===keyD(v))){DB.setup.ricorrenti.push({desc:v,categoria:$('#new_ric_cat').value});saveDB();render();toast('Voce aggiunta')}}
  else if(a==='rm-ric'){const i=+t.dataset.i,x=DB.setup.ricorrenti[i];if(x&&confirm('Tolgo "'+x.desc+'" dalle voci ricorrenti? Le spese già registrate restano.')){DB.setup.ricorrenti.splice(i,1);saveDB();render()}}
  else if(a==='tog-mo'){const k=t.dataset.k;UI.mo[k][t.dataset.ym]=t.getAttribute('aria-expanded')!=='true';k==='inc'?listInc():listSp()}
  else if(a==='mo-all'){const k=t.dataset.k,v=t.dataset.v==='1';document.querySelectorAll('.mhead[data-k="'+k+'"]').forEach(h=>{UI.mo[k][h.dataset.ym]=v});k==='inc'?listInc():listSp()}
  else if(a==='sy-login'){syLogin()}
  else if(a==='sy-now'){doSync().then(()=>{if(UI.tab==='setup')render()})}
  else if(a==='sy-logout'){if(confirm('Esco dalla sincronizzazione? I dati restano su questo dispositivo.')){AUTH=null;TOK={id:'',exp:0};try{localStorage.removeItem(AUTH_KEY);localStorage.removeItem(SYNC_KEY)}catch(e){}SY={pull:-1,push:0,at:0};setSync('off');render()}}
  else if(a==='export'){download('dema-backup-'+todayISO()+'.json',JSON.stringify(DB,null,1));localStorage.setItem(KEY_EXP,String(Date.now()));renderShell();toast('Backup scaricato')}
  else if(a==='csv-inc'){download('dema-incassi.csv','\ufeffData;Contanti;POS;Satispay;Totale;Chiusura;Meteo;Evento\n'+DB.incassi.slice().sort((x,y)=>x.data.localeCompare(y.data)).map(r=>[r.data,cn(r.contanti),cn(r.pos),cn(r.satispay),cn(r2(tot(r))),cn(r.chiusura),csvCell(r.meteo),csvCell(r.evento)].join(';')).join('\n'),'text/csv')}
  else if(a==='csv-sp'){download('dema-spese.csv','\ufeffData;Fornitore;Importo;Categoria;Evento\n'+DB.spese.slice().sort((x,y)=>x.data.localeCompare(y.data)).map(r=>[r.data,csvCell(r.desc),cn(r.importo),csvCell(r.categoria),csvCell(r.evento)].join(';')).join('\n'),'text/csv')}
  else if(a==='save-prezzo'){DB.setup.prezzoMedio=numParse($('#prezzo').value)||5.5;saveDB();toast('Salvato')}
  else if(a==='add-list'){const k=t.dataset.k,v=$('#new_'+k).value.trim();if(v&&!DB.setup[k].includes(v)){DB.setup[k].push(v);saveDB();render()}}
  else if(a==='rm-list'){e.preventDefault();const k=t.dataset.k,i=+t.dataset.i,v=DB.setup[k][i];if(confirm('Tolgo "'+v+'" dall\'elenco? Le righe già registrate restano com\'erano.')){DB.setup[k].splice(i,1);saveDB();render()}}
  else if(a==='wipe'){if(confirm(AUTH?'Cancello TUTTI i dati, anche dal cloud (spariscono su ogni dispositivo)?':'Cancello TUTTI i dati di questo browser?')&&confirm('Sei sicuro? Non si torna indietro.')){DB=emptyDB();saveDB();render();toast('Dati cancellati')}}
});
document.addEventListener('submit',e=>{
  const id=e.target.id; if(id==='incForm')saveInc(e);else if(id==='spForm')saveSp(e);else if(id==='anForm')saveAn(e);else if(id==='txForm')saveTx(e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(['i_c','i_p','i_s'].includes(t.id))updIncTot();
  if(t.classList&&t.classList.contains('cm-in')){UI.close.vals[t.dataset.k]=t.value;$('#cm_tot').textContent=fmtE(closeTot())}
  if(t.id==='s_desc'&&!UI.edit.sp){
    const last=DB.spese.filter(r=>(r.desc||'').toLowerCase()===t.value.trim().toLowerCase()).sort((a,b)=>b.data.localeCompare(a.data))[0];
    if(last)$('#s_cat').value=last.categoria;
  }
  if(t.dataset.f&&t.tagName==='INPUT'&&t.type==='search'){const[p,k]=t.dataset.f.split('.');UI.f[p][k]=t.value;UI.lim[p==='inc'?'inc':'sp']=60;listSp()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='i_data'&&UI.tab==='incassi'){ // se esiste già un incasso in quella data lo apre in modifica
    const ex=DB.incassi.find(r=>r.data===t.value);UI.edit.inc=ex?ex.id:null;const d=t.value;fillIncForm();$('#i_data').value=d;listInc();
  }
  if(t.dataset.f&&!(t.tagName==='INPUT'&&t.type==='search')){
    const[p,k]=t.dataset.f.split('.');UI.f[p][k]=t.value;UI.lim[p==='inc'?'inc':'sp']=60;p==='inc'?listInc():listSp();
  }
  if(t.id==='cm_ym'){UI.close.ym=t.value;UI.close.data=lastDay(t.value);render()}
  if(t.id==='cm_data'){UI.close.data=t.value}
  if(t.id==='impMerge'&&t.files[0]){importFile(t.files[0],'merge');t.value=''}
  if(t.id==='impReplace'&&t.files[0]){importFile(t.files[0],'replace');t.value=''}
});
document.addEventListener('click',e=>{
  if(e.target.id==='incCancel'){UI.edit.inc=null;UI.open.inc=false;render()}
  if(e.target.id==='spCancel'){UI.edit.sp=null;UI.open.sp=false;render()}
  if(e.target.id==='anCancel'){UI.edit.an=null;fillFisseForms();listFisse()}
  if(e.target.id==='txCancel'){UI.edit.tx=null;fillFisseForms();listFisse()}
});

buildSIG();
render();
if(AUTH){setSync('idle');doSync()}
})();
</script>
</body>
</html>
